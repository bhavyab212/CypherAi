            <path d="M20 13.5 L25 16.5 L20 19.5 L15 16.5 Z" fill="#ffffff" fill-opacity="0.95"/>

      <!-- 02 UI/UX -->
      <div class="intro2-clay-pill intro2-pill--2" role="listitem" tabindex="0">
        <span class="intro2-clay-icon intro2-clay-icon--slate" aria-hidden="true">
          <svg viewBox="0 0 28 28" width="24" height="24" fill="none">

            <rect x="5.5" y="3.5" width="17" height="21" rx="4" fill="#ffffff" fill-opacity="0.18" stroke="#ffffff" stroke-width="1.6"/>

        </span>

      <!-- 03 Research -->
      <div class="intro2-clay-pill intro2-pill--3" role="listitem" tabindex="0">
        <span class="intro2-clay-icon intro2-clay-icon--cyan" aria-hidden="true">
          <svg viewBox="0 0 28 28" width="24" height="24" fill="none">

            <circle cx="12" cy="12" r="7.5" stroke="#ffffff" stroke-width="2.2" fill="#ffffff" fill-opacity="0.15"/>

            <circle cx="12" cy="12" r="1.8" fill="#ffffff" fill-opacity="0.9"/>

      <!-- 04 Branding -->
      <div class="intro2-clay-pill intro2-pill--4" role="listitem" tabindex="0">
        <span class="intro2-clay-icon intro2-clay-icon--violet" aria-hidden="true">
          <svg viewBox="0 0 28 28" width="24" height="24" fill="none">
            <!-- 3D Faceted Diamond / Radiant Star Gem -->
            <path d="M14 2.5 L17.5 10 L25.5 14 L17.5 18 L14 25.5 L10.5 18 L2.5 14 L10.5 10 Z" fill="#ffffff" fill-opacity="0.9"/>

            <path d="M17.5 10 L25.5 14 L14 14 Z" fill="#ffffff" fill-opacity="0.75"/>

            <circle cx="14" cy="14" r="1.5" fill="#ffffff"/>
          </svg>
        </span>
        <span class="intro2-clay-label">Branding</span>
      </div>

    </div>

    <!-- Center Statement with Claymorphic Eyebrow -->
    <div class="intro2-center">
      <div class="intro2-eyebrow" tabindex="0">
        <span class="intro2-eyebrow__pip" aria-hidden="true"></span>
        <span class="intro2-eyebrow__text">Studio Philosophy</span>
      </div>
      <h2 class="intro2-heading" data-intro2-reveal>
        We help startups and enterprise to establish an emotional connection between their products and happy engaged customers
      </h2>
    </div>

    <!-- Right Discipline Constellation (Curved Arc Embracing the Headline) -->
    <div class="intro2-arc intro2-arc--right" role="list" aria-label="Engineering and Motion Disciplines">

      <!-- 05 Animation -->
      <div class="intro2-clay-pill intro2-pill--5" role="listitem" tabindex="0">

            <ellipse cx="14" cy="14" rx="10" ry="4.5" stroke="#ffffff" stroke-width="1.8" transform="rotate(-25 14 14)" stroke-dasharray="32 8" opacity="0.95"/>

            <circle cx="12.5" cy="12.5" r="1.5" fill="#a7f3d0"/>

        </span>

            <!-- Top Layer Plate -->
            <path d="M14 4 L22 8 L14 12 L6 8 Z" fill="#ffffff" fill-opacity="0.95"/>
            <path d="M6 8 L14 12 L14 13 L6 9 Z" fill="#ffffff" fill-opacity="0.7"/>
            <path d="M22 8 L14 12 L14 13 L22 9 Z" fill="#ffffff" fill-opacity="0.5"/>

            <path d="M22 20 L14 24 L14 25 L22 21 Z" fill="#ffffff" fill-opacity="0.3"/>

            <line x1="14" y1="20.5" x2="14" y2="22.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

            <!-- North Needle Shaded Half -->

            <!-- South Needle Dark Half -->
