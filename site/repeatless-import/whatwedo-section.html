<div class="rl-import">
<section class="wwd-section" id="wwd-section">
  <div class="wwd-bg"></div>
  <div class="wwd-grid"></div>

  <!-- Desktop layout -->
  <div class="wwd-progress"><div class="wwd-progress__bar" id="wwd-progress-bar"></div></div>
  <h2 class="wwd-title">What We Do</h2>

  <div class="wwd-grid-layout">
    <div class="wwd-grid-layout__spacer"></div>
    <div class="wwd-grid-layout__orbit">
      <div class="wwd-orbit" id="wwd-orbit-desktop">
        <div class="wwd-orbit__glow"></div>
        <svg viewBox="0 0 420 420" aria-hidden="true">
          <defs>
            <radialGradient id="wwd-fill" cx="50%" cy="50%" r="58%">
              <stop offset="0%" stop-color="#050608"/>
              <stop offset="68%" stop-color="#12111d"/>
              <stop offset="100%" stop-color="#171329"/>
            </radialGradient>
          </defs>
          <circle cx="210" cy="210" r="154" fill="url(#wwd-fill)"/>
          <circle cx="210" cy="210" r="160" fill="none" stroke="rgba(124,58,237,0.42)" stroke-width="1.5" stroke-dasharray="7 6"/>
          <circle cx="210" cy="210" r="176" fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1"/>
          <circle class="wwd-orbit-ring" cx="210" cy="210" r="176" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1105.84" transform="rotate(180 210 210)" stroke-dashoffset="1105.84"/>
        </svg>
        <div class="wwd-orbit__mask"></div>
        <div class="wwd-orbit__content" id="wwd-cards-desktop"></div>
      </div>
    </div>
  </div>

  <div class="wwd-left">
    <div class="wwd-labels"><div class="wwd-labels__track" id="wwd-labels-track"></div></div>
    <div class="wwd-desc"><div class="wwd-desc__track" id="wwd-desc-track"></div></div>
  </div>

  <div class="wwd-bignum">
    <span>0</span>
    <span class="wwd-bignum__digit"><span class="wwd-bignum__track" id="wwd-bignum-track"></span></span>
  </div>

  <!-- Mobile layout -->
  <div class="wwd-mobile">
    <div class="wwd-mobile__progress"><div class="wwd-mobile__progress-bar" id="wwd-progress-bar-m"></div></div>
    <h2 class="wwd-mobile__title">What We Do</h2>
    <div class="wwd-mobile__row">
      <div class="wwd-mobile__num">
        <span>0</span>
        <span class="wwd-bignum__digit"><span class="wwd-bignum__track" id="wwd-bignum-track-m"></span></span>
      </div>
      <div class="wwd-mobile__text-wrap">
        <div class="wwd-mobile__arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7v10h10"/><path d="M17 7 7 17"/></svg></div>
        <div class="wwd-mobile__desc" id="wwd-desc-track-m"></div>
      </div>
    </div>
    <div class="wwd-mobile__orbit-wrap">
      <div class="wwd-orbit wwd-orbit--mobile" id="wwd-orbit-mobile">
        <div class="wwd-orbit__glow"></div>
        <svg viewBox="0 0 420 420" aria-hidden="true">
          <circle cx="210" cy="210" r="154" fill="url(#wwd-fill)"/>
          <circle cx="210" cy="210" r="160" fill="none" stroke="rgba(124,58,237,0.42)" stroke-width="1.5" stroke-dasharray="7 6"/>
          <circle cx="210" cy="210" r="176" fill="none" stroke="rgba(255,255,255,0.13)" stroke-width="1"/>
          <circle class="wwd-orbit-ring" cx="210" cy="210" r="176" fill="none" stroke="rgba(255,255,255,0.72)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1105.84" transform="rotate(180 210 210)" stroke-dashoffset="1105.84"/>
        </svg>
        <div class="wwd-orbit__mask"></div>
        <div class="wwd-orbit__content" id="wwd-cards-mobile"></div>
      </div>
    </div>
  </div>
</section>
</div>
